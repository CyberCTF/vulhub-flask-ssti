# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Flask Jinja2 SSTI (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's flask/ssti, vendored in build/web/app/: the published image
# vulhub/flask:1.1.1 with the application copied in.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-flask-ssti

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.237.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 8000, name: web, http: true, publish: 8000 }]
    resources: { cpus: 1, memory_mb: 256 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the application answers
    http: http://web:8000/
    wait: 60
  - name: the page echoes the name parameter
    script: checks/name.sh
    wait: 60

message: |
  A Flask application answers at http://localhost:{{ machines.web.services.0.publish }}/.
  It greets you by ?name=: how is that greeting rendered?
